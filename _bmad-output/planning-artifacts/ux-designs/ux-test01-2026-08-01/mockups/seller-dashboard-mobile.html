<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Персональная витрина — seller dashboard mock</title>
  <style>
    body{margin:0;background:#f7f7f5;color:#111;font:15px/1.45 Inter,system-ui,sans-serif}.phone{max-width:390px;margin:0 auto;min-height:100vh;padding:18px 16px 88px}header{display:flex;justify-content:space-between;align-items:center}.pill{border:1px solid #e2e2de;border-radius:999px;padding:8px 12px;background:#fff}.glass{margin:18px 0;background:rgba(255,255,255,.76);backdrop-filter:blur(18px);border:1px solid #e2e2de;border-radius:28px;padding:20px;box-shadow:0 16px 40px rgba(17,17,17,.06)}.big{font-size:44px;font-weight:720;letter-spacing:-.04em}.muted{color:#5f5f5b}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e2e2de;border-radius:20px;padding:14px}.num{font-size:24px;font-weight:700}.action{width:100%;height:52px;border:0;border-radius:999px;background:#111;color:#fff;font-weight:700;margin-top:18px}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(358px,calc(100vw - 32px));background:#fff;border:1px solid #e2e2de;border-radius:999px;display:flex;justify-content:space-around;padding:10px 8px;color:#5f5f5b}.nav strong{color:#111}
  </style>
</head>
<body>
  <main class="phone">
    <header><h1>Сегодня</h1><div class="pill">Предпросмотр</div></header>
    <section class="glass">
      <div class="muted">Просмотры магазина</div>
      <div class="big">42</div>
      <div class="muted">Лучший источник: Telegram</div>
    </section>
    <section class="cards">
      <div class="card"><div class="muted">Просмотры товаров</div><div class="num">67</div></div>
      <div class="card"><div class="muted">Клики CTA</div><div class="num">9</div></div>
      <div class="card"><div class="muted">Товар-лидер</div><div class="num">Luna</div></div>
      <div class="card"><div class="muted">Опубликовано</div><div class="num">18</div></div>
    </section>
    <button class="action">Добавить товар</button>
  </main>
  <nav class="nav"><strong>Дом</strong><span>Товары</span><span>Аналитика</span><span>Магазин</span></nav>
</body>
</html>
